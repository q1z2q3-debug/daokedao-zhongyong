<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
<title>其次致曲图：一粒种子与六级波纹</title>
<desc>左下一粒种子抽出芽，芽外六道渐大的波纹，依次标形、著、明、动、变、化，最外一道淡到几乎看不见。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<ellipse cx="176" cy="316" rx="16" ry="11" fill="#994433"/>
<path d="M176 305 C170 270 186 246 208 232" fill="none" stroke="#7C6D5C" stroke-width="2"/>
<path d="M186 262 C206 258 214 244 214 232" fill="none" stroke="#7C6D5C" stroke-width="1.5"/>
<g fill="none" stroke="#DCD5C8" stroke-width="1.4">
<path d="M214 316 A38 38 0 0 1 214 240"/>
<path d="M214 316 A76 76 0 0 1 214 202"/>
<path d="M214 316 A114 114 0 0 1 214 164"/>
<path d="M214 316 A152 152 0 0 1 214 126"/>
<path d="M214 316 A190 190 0 0 1 214 88"/>
<path d="M214 316 A228 228 0 0 1 214 50" stroke-dasharray="5 7" opacity="0.65"/>
</g>
<text x="236" y="292" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">形</text>
<text x="236" y="270" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">著</text>
<text x="236" y="240" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">明</text>
<text x="236" y="204" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">动</text>
<text x="236" y="166" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">变</text>
<text x="236" y="120" font-size="13" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">化</text>
<text x="60" y="420" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">曲能有诚　唯至诚为能化</text>
<text x="60" y="446" font-size="12" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">入口只是一偏，波纹一圈比一圈淡</text>
</svg>
