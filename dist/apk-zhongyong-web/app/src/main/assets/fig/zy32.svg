<path d="M90 200 C142 180 172 232 206 200 C240 168 268 214 296 200"/>
<path d="M92 232 C144 216 176 262 210 232 C244 204 270 244 298 232"/>
</g>
<rect x="300" y="120" width="300" height="230" fill="none" stroke="#25211D" stroke-width="1.5"/>
<path d="M320 140 V330 M356 140 V330 M392 140 V330 M428 140 V330 M464 140 V330 M500 140 V330 M536 140 V330 M572 140 V330" stroke="#7C6D5C" stroke-width="1"/>
<path d="M320 170 H574 M320 206 H574 M320 242 H574 M320 278 H574 M320 314 H574" stroke="#DCD5C8" stroke-width="1"/>
<rect x="536" y="96" width="64" height="34" fill="#994433"/>
