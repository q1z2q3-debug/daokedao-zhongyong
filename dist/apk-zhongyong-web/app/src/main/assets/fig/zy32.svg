<path d="M480 350 V404 M480 404 C508 398 524 414 546 404" stroke="#7C6D5C" stroke-width="1.5"/>
<circle cx="546" cy="392" r="7" fill="none" stroke="#994433" stroke-width="1.2"/>
<text x="90" y="282" font-size="12" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">乱丝</text>
<text x="366" y="378" font-size="12" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">经纶成布</text>
<text x="60" y="64" font-size="15" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">唯天下至诚</text>
<text x="200" y="440" font-size="12" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">分其绪，比其类；布成而根在土</text>
</svg>
