<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第十四章义理图：四个格子与一支箭</title>
<desc>四格横排标富贵贫贱夷狄患难，各写行乎其中；右下靶心箭偏，箭头折回射者胸口，标反求诸其身。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="42" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">位是材料，不是理由</text>

<rect x="40" y="80" width="140" height="90" fill="#FCFAF6" stroke="#DCD5C8"/>
<rect x="190" y="80" width="140" height="90" fill="#FCFAF6" stroke="#DCD5C8"/>
<rect x="340" y="80" width="140" height="90" fill="#FCFAF6" stroke="#DCD5C8"/>
<rect x="490" y="80" width="140" height="90" fill="#FCFAF6" stroke="#DCD5C8"/>

<text x="110" y="112" font-size="13" text-anchor="middle" fill="#25211D">富贵</text>
<text x="110" y="140" font-size="11" text-anchor="middle" fill="#7C6D5C">行乎富贵</text>
<text x="260" y="112" font-size="13" text-anchor="middle" fill="#25211D">贫贱</text>
<text x="260" y="140" font-size="11" text-anchor="middle" fill="#7C6D5C">行乎贫贱</text>
<text x="410" y="112" font-size="13" text-anchor="middle" fill="#25211D">夷狄</text>
<text x="410" y="140" font-size="11" text-anchor="middle" fill="#7C6D5C">行乎夷狄</text>
<text x="560" y="112" font-size="13" text-anchor="middle" fill="#25211D">患难</text>
<text x="560" y="140" font-size="11" text-anchor="middle" fill="#7C6D5C">行乎患难</text>

<text x="360" y="200" font-size="11" text-anchor="middle" fill="#7C6D5C">四格并排而无高下：处境不同，做法只有一条</text>

<circle cx="520" cy="290" r="34" fill="none" stroke="#25211D"/>
<circle cx="520" cy="290" r="8" fill="#994433"/>
<text x="520" y="342" font-size="11" text-anchor="middle" fill="#7C6D5C">正鹄：不动</text>

<line x1="430" y1="360" x2="500" y2="316" stroke="#7C6D5C" stroke-width="1.2"/>
<line x1="430" y1="360" x2="360" y2="330" stroke="#994433" stroke-width="1.4"/>
<polygon points="352,327 364,326 362,336" fill="#994433"/>
<text x="330" y="322" font-size="11" text-anchor="end" fill="#994433">反求诸其身</text>

<circle cx="330" cy="382" r="10" fill="none" stroke="#25211D"/>
<text x="330" y="416" font-size="11" text-anchor="middle" fill="#7C6D5C">射者</text>
</g>
</svg>
