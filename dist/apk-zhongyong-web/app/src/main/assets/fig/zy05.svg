<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第五章义理图：一声叹息的位置</title>
<desc>横轴标一至四章分析与六章后例证，第五章居中作下凹停顿，标道其不行矣夫，两侧箭头一收一放。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="44" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">诊断之后，先停一句</text>

<line x1="70" y1="150" x2="360" y2="150" stroke="#7C6D5C" stroke-width="1.4"/>
<line x1="360" y1="150" x2="360" y2="250" stroke="#994433" stroke-width="1.4"/>
<line x1="360" y1="250" x2="650" y2="250" stroke="#7C6D5C" stroke-width="1.4"/>

<text x="210" y="134" font-size="12" text-anchor="middle" fill="#7C6D5C">一至四章　分析（放·阳）</text>
<text x="505" y="234" font-size="12" text-anchor="middle" fill="#7C6D5C">六章以后　例证（收·阴）</text>

<text x="376" y="200" font-size="15" fill="#994433">道其不行矣夫</text>
<text x="376" y="222" font-size="11" fill="#7C6D5C">八字，一顿，一句叹</text>

<rect x="60" y="300" width="600" height="120" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="80" y="328" font-size="12" fill="#7C6D5C">三层不同步，才有叹息</text>
<text x="80" y="354" font-size="12" fill="#25211D">识：看清了不行　　受想行：生出惋惜　　色：原地不动</text>
<text x="80" y="380" font-size="12" fill="#25211D">承认是准：硬说行是过，垂头到底是不及</text>
<text x="80" y="406" font-size="11" fill="#7C6D5C">下一章：既然不行，就找一个能行的人来看</text>
</g>
</svg>
