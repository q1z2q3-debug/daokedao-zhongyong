<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第十三章义理图：斧柄与四把尺</title>
<desc>中央一柄斧、柄上刻则；四支短尺分别标子父、臣君、弟兄、友先施，皆指向斧柄，外向箭头为要求，内向为反求。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="44" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">标准就在手边</text>

<line x1="300" y1="200" x2="300" y2="380" stroke="#25211D" stroke-width="3"/>
<path d="M250 150 q 50 -30 100 0 l 10 60 q -60 20 -120 0 z" fill="#FCFAF6" stroke="#25211D"/>
<text x="300" y="270" font-size="12" text-anchor="middle" fill="#994433">则</text>
<text x="300" y="404" font-size="11" text-anchor="middle" fill="#7C6D5C">样子在柄上</text>

<line x1="300" y1="120" x2="180" y2="80" stroke="#7C6D5C"/>
<text x="150" y="76" font-size="11" text-anchor="middle" fill="#25211D">子—父</text>
<line x1="300" y1="120" x2="420" y2="80" stroke="#7C6D5C"/>
<text x="450" y="76" font-size="11" text-anchor="middle" fill="#25211D">臣—君</text>
<line x1="300" y1="120" x2="180" y2="420" stroke="#7C6D5C" stroke-dasharray="4 4"/>
<text x="150" y="432" font-size="11" text-anchor="middle" fill="#25211D">弟—兄</text>
<line x1="300" y1="120" x2="420" y2="420" stroke="#7C6D5C" stroke-dasharray="4 4"/>
<text x="450" y="432" font-size="11" text-anchor="middle" fill="#25211D">友—先施</text>

<text x="60" y="180" font-size="11" fill="#7C6D5C">外向＝要求别人</text>
<text x="560" y="180" font-size="11" fill="#994433">内向＝反求诸己</text>
<line x1="560" y1="200" x2="470" y2="230" stroke="#994433" stroke-width="1.2"/>
<polygon points="462,233 474,225 476,237" fill="#994433"/>
</g>
</svg>
