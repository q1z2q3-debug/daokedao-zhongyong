<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <title>ZY26 至诚无息义理图：无息五环与天地山水分喻</title>
  <desc>上排顶真链无息、久、征、悠远、博厚、高明；中排博厚载物、高明覆物、悠久成物；下排天地山水四喻，收于不贰。</desc>
  <rect x="0" y="0" width="960" height="620" fill="#F7F4EE"/>
  <text x="480" y="40" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="18" fill="#25211D">第二十六章　至诚无息：时间里的诚与天地同用</text>

  <g font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#25211D">
    <text x="40" y="86" font-size="13" fill="#7C6D5C">无息五环（顶真相推）</text>
    <g>
      <rect x="40" y="100" width="120" height="54" rx="6" fill="#994433" stroke="#994433"/>
      <text x="100" y="132" text-anchor="middle" fill="#FCFAF6">无息</text>
      <line x1="160" y1="127" x2="186" y2="127" stroke="#7C6D5C" stroke-width="1.5"/>
      <polygon points="186,127 179,123 179,131" fill="#7C6D5C"/>
      <rect x="186" y="100" width="120" height="54" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
      <text x="246" y="132" text-anchor="middle">久</text>
      <line x1="306" y1="127" x2="332" y2="127" stroke="#7C6D5C" stroke-width="1.5"/>
      <polygon points="332,127 325,123 325,131" fill="#7C6D5C"/>
      <rect x="332" y="100" width="120" height="54" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
      <text x="392" y="132" text-anchor="middle">征</text>
      <line x1="452" y1="127" x2="478" y2="127" stroke="#7C6D5C" stroke-width="1.5"/>
      <polygon points="478,127 471,123 471,131" fill="#7C6D5C"/>
      <rect x="478" y="100" width="120" height="54" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
      <text x="538" y="132" text-anchor="middle">悠远</text>
      <line x1="598" y1="127" x2="624" y2="127" stroke="#7C6D5C" stroke-width="1.5"/>
      <polygon points="624,127 617,123 617,131" fill="#7C6D5C"/>
      <rect x="624" y="100" width="120" height="54" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
      <text x="684" y="132" text-anchor="middle">博厚</text>
      <line x1="744" y1="127" x2="770" y2="127" stroke="#7C6D5C" stroke-width="1.5"/>
      <polygon points="770,127 763,123 763,131" fill="#7C6D5C"/>
      <rect x="770" y="100" width="150" height="54" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
      <text x="845" y="132" text-anchor="middle">高明</text>
    </g>
  </g>

  <g font-family="'Noto Serif SC','Songti SC',serif" font-size="13" fill="#25211D">
    <rect x="60" y="200" width="250" height="70" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="185" y="228" text-anchor="middle">博厚　载物</text>
    <text x="185" y="252" text-anchor="middle" font-size="11" fill="#7C6D5C">配地</text>
    <rect x="355" y="200" width="250" height="70" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="480" y="228" text-anchor="middle">高明　覆物</text>
    <text x="480" y="252" text-anchor="middle" font-size="11" fill="#7C6D5C">配天</text>
    <rect x="650" y="200" width="250" height="70" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="775" y="228" text-anchor="middle">悠久　成物</text>
    <text x="775" y="252" text-anchor="middle" font-size="11" fill="#7C6D5C">无疆</text>
  </g>

  <g font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#25211D">
    <text x="40" y="320" font-size="13" fill="#7C6D5C">天地山水分喻（由小及大，根在不贰）</text>
    <rect x="40" y="335" width="205" height="90" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="142" y="362" text-anchor="middle">天</text>
    <text x="142" y="386" text-anchor="middle" font-size="11">昭昭之多</text>
    <text x="142" y="408" text-anchor="middle" font-size="11" fill="#7C6D5C">日月星辰系焉，万物覆焉</text>
    <rect x="265" y="335" width="205" height="90" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="367" y="362" text-anchor="middle">地</text>
    <text x="367" y="386" text-anchor="middle" font-size="11">一撮土之多</text>
    <text x="367" y="408" text-anchor="middle" font-size="11" fill="#7C6D5C">载华岳不重，振河海不泄</text>
    <rect x="490" y="335" width="205" height="90" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="592" y="362" text-anchor="middle">山</text>
    <text x="592" y="386" text-anchor="middle" font-size="11">一卷石之多</text>
    <text x="592" y="408" text-anchor="middle" font-size="11" fill="#7C6D5C">草木生之，禽兽居之，宝藏兴焉</text>
    <rect x="715" y="335" width="205" height="90" rx="6" fill="#FCFAF6" stroke="#DCD5C8"/>
    <text x="817" y="362" text-anchor="middle">水</text>
    <text x="817" y="386" text-anchor="middle" font-size="11">一勺之多</text>
    <text x="817" y="408" text-anchor="middle" font-size="11" fill="#7C6D5C">鼋鼍蛟龙鱼鳖生焉，货财殖焉</text>
  </g>

  <g font-family="'Noto Serif SC','Songti SC',serif" fill="#25211D">
    <rect x="350" y="470" width="260" height="56" rx="6" fill="#994433"/>
    <text x="480" y="504" text-anchor="middle" font-size="15" fill="#FCFAF6">其为物不贰，则其生物不测</text>
  </g>

  <g font-family="'Noto Serif SC','Songti SC',serif" font-size="12" fill="#7C6D5C">
    <text x="40" y="560">读图：上排五环环环相推，第一环是无息；中排载、覆、成配地、天、时间；下排四喻由小及大，根在专一不二。</text>
    <text x="40" y="588">图说：横看是时间里的递进，竖看是与天地同体；根在不贰，效在不测。</text>
  </g>
</svg>
