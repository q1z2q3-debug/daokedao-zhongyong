<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
<title>至诚尽性图：四层同心与一道开口</title>
<desc>四层同心圆由内向外为己之性、人之性、物之性、天地化育；最外圈上方开口，一支箭头由圆心穿出，标参。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<circle cx="330" cy="270" r="58" fill="#FCFAF6" stroke="#DCD5C8" stroke-width="1.5"/>
<circle cx="330" cy="270" r="106" fill="none" stroke="#DCD5C8" stroke-width="1.5"/>
<circle cx="330" cy="270" r="152" fill="none" stroke="#DCD5C8" stroke-width="1.5"/>
<circle cx="330" cy="270" r="196" fill="none" stroke="#DCD5C8" stroke-width="1.5" stroke-dasharray="6 6"/>
<path d="M330 74 v108" stroke="#994433" stroke-width="3"/>
<path d="M330 74 l-8 16 h16 Z" fill="#994433"/>
<text x="330" y="272" font-size="14" fill="#25211D" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">己之性</text>
<text x="330" y="212" font-size="13" fill="#7C6D5C" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">人之性</text>
<text x="330" y="166" font-size="13" fill="#7C6D5C" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">物之性</text>
<text x="330" y="120" font-size="13" fill="#994433" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">天地化育</text>
<text x="352" y="66" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">参</text>
<text x="540" y="300" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">尽从己始</text>
<text x="540" y="324" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">层层向外</text>
<text x="60" y="430" font-size="14" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">尽己 · 尽人 · 尽物 · 赞化育 · 与天地参</text>
</svg>
