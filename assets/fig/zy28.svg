<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第二十八章义理图：自用之病与德位之界</title>
<desc>上排三格标自用、自专、反古，各画一扇关上的门；下排两柱位与德，礼乐悬于其间，柱下各注无德不敢、无位不敢；界外一人考文献，题孔子从周。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="44" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">上排写病根　下排写边界</text>

<rect x="70" y="80" width="180" height="150" fill="#FCFAF6" stroke="#DCD5C8"/>
<rect x="270" y="80" width="180" height="150" fill="#FCFAF6" stroke="#DCD5C8"/>
<rect x="470" y="80" width="180" height="150" fill="#FCFAF6" stroke="#DCD5C8"/>

<text x="160" y="112" font-size="15" text-anchor="middle" fill="#994433">自用</text>
<text x="360" y="112" font-size="15" text-anchor="middle" fill="#994433">自专</text>
<text x="560" y="112" font-size="15" text-anchor="middle" fill="#994433">反古</text>

<rect x="130" y="130" width="60" height="70" fill="#DCD5C8"/>
<line x1="160" y1="130" x2="160" y2="200" stroke="#7C6D5C"/>
<circle cx="150" cy="165" r="2.5" fill="#7C6D5C"/>

<rect x="330" y="130" width="60" height="70" fill="#DCD5C8"/>
<line x1="360" y1="130" x2="360" y2="200" stroke="#7C6D5C"/>
<circle cx="350" cy="165" r="2.5" fill="#7C6D5C"/>

<rect x="530" y="130" width="60" height="70" fill="#DCD5C8"/>
<line x1="560" y1="130" x2="560" y2="200" stroke="#7C6D5C"/>
<circle cx="550" cy="165" r="2.5" fill="#7C6D5C"/>

<text x="160" y="218" font-size="11" text-anchor="middle" fill="#7C6D5C">不肯取于人</text>
<text x="360" y="218" font-size="11" text-anchor="middle" fill="#7C6D5C">不肯让于众</text>
<text x="560" y="218" font-size="11" text-anchor="middle" fill="#7C6D5C">不肯合于时</text>
</g>

<g font-family="'Noto Serif SC','Songti SC',serif">
<line x1="90" y1="300" x2="630" y2="300" stroke="#7C6D5C" stroke-width="1.2"/>
<rect x="170" y="262" width="56" height="76" fill="#FCFAF6" stroke="#7C6D5C"/>
<rect x="494" y="262" width="56" height="76" fill="#FCFAF6" stroke="#7C6D5C"/>
<text x="198" y="308" font-size="16" text-anchor="middle" fill="#25211D">位</text>
<text x="522" y="308" font-size="16" text-anchor="middle" fill="#25211D">德</text>

<rect x="310" y="272" width="100" height="36" fill="#994433"/>
<text x="360" y="296" font-size="15" text-anchor="middle" fill="#FCFAF6">礼乐</text>

<text x="198" y="356" font-size="11" text-anchor="middle" fill="#7C6D5C">无德不敢</text>
<text x="522" y="356" font-size="11" text-anchor="middle" fill="#7C6D5C">无位不敢</text>

<circle cx="360" cy="414" r="10" fill="#7C6D5C"/>
<line x1="360" y1="424" x2="360" y2="450" stroke="#7C6D5C" stroke-width="1.5"/>
<line x1="348" y1="434" x2="372" y2="434" stroke="#7C6D5C" stroke-width="1.5"/>
<text x="430" y="420" font-size="12" fill="#25211D">孔子从周：考而后择，择而后从</text>
</g>
</svg>
