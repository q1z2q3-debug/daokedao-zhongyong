<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第十二章义理图：一张尺寸图</title>
<desc>上方横线标费、下方竖线标隐，中间一对普通男女为起点，右上鹰左下鱼指向上下察。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="42" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">广到装不下，细到剖不开</text>

<line x1="20" y1="130" x2="700" y2="130" stroke="#7C6D5C" stroke-width="1.4"/>
<text x="360" y="116" font-size="12" text-anchor="middle" fill="#7C6D5C">费：天下莫能载</text>

<line x1="360" y1="150" x2="360" y2="430" stroke="#25211D" stroke-width="0.8" stroke-dasharray="3 6"/>
<text x="374" y="410" font-size="12" fill="#7C6D5C">隐：天下莫能破</text>

<circle cx="120" cy="188" r="16" fill="none" stroke="#994433"/>
<text x="120" y="222" font-size="11" text-anchor="middle" fill="#994433">鸢：飞至天</text>
<path d="M120 204 L 200 250" stroke="#DCD5C8" stroke-width="1" stroke-dasharray="5 4"/>

<circle cx="140" cy="330" r="14" fill="none" stroke="#7C6D5C"/>
<text x="140" y="364" font-size="11" text-anchor="middle" fill="#7C6D5C">鱼：跃于渊</text>
<path d="M156 322 L 230 286" stroke="#DCD5C8" stroke-width="1" stroke-dasharray="5 4"/>

<rect x="300" y="250" width="120" height="90" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="360" y="282" font-size="12" text-anchor="middle" fill="#25211D">夫妇之愚</text>
<text x="360" y="304" font-size="11" text-anchor="middle" fill="#7C6D5C">可以与知</text>
<text x="360" y="326" font-size="11" text-anchor="middle" fill="#7C6D5C">可以能行</text>

<line x1="420" y1="292" x2="560" y2="292" stroke="#994433" stroke-width="1.2"/>
<polygon points="568,292 556,287 556,297" fill="#994433"/>
<text x="590" y="288" font-size="12" fill="#994433">上下察</text>
<text x="590" y="310" font-size="11" fill="#7C6D5C">圣人亦有</text>
<text x="590" y="328" font-size="11" fill="#7C6D5C">所不知不能</text>
</g>
</svg>
