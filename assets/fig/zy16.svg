<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
<title>鬼神之为德图：微之显</title>
<desc>上方一道淡墨气向下，下方一道赭色气向上，穿过草木屋舍与人；中央祭坛一人斋服而立，头顶虚线连微，身前实线连显。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<path d="M30 96 C160 60 260 140 360 104 C470 64 560 130 690 92" fill="none" stroke="#7C6D5C" stroke-width="2" stroke-dasharray="7 7" opacity="0.55"/>
<path d="M30 390 C150 424 260 356 360 392 C480 432 570 362 690 398" fill="none" stroke="#994433" stroke-width="2" opacity="0.55"/>
<text x="40" y="76" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">视之而弗见，听之而弗闻</text>
<text x="470" y="446" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">至而伸者为神，反而归者为鬼</text>
<g stroke="#7C6D5C" stroke-width="1.5" fill="#FCFAF6">
<rect x="120" y="236" width="52" height="60"/>
<path d="M110 236 L146 208 L182 236" fill="none"/>
<path d="M300 292 v-46 l18 -14 l18 14 v46 Z"/>
<circle cx="470" cy="252" r="15"/>
<path d="M470 267 v40 M452 292 h36" fill="none"/>
</g>
<rect x="352" y="296" width="84" height="54" fill="#FCFAF6" stroke="#994433" stroke-width="1.5"/>
<path d="M344 296 h92" stroke="#994433" stroke-width="2"/>
<rect x="380" y="316" width="28" height="34" fill="none" stroke="#7C6D5C" stroke-width="1"/>
<text x="330" y="372" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">齐明盛服，以承祭祀</text>
<path d="M394 296 C394 220 360 170 300 150" fill="none" stroke="#DCD5C8" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="266" y="142" font-size="14" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">微</text>
<path d="M394 350 C420 380 470 386 520 378" fill="none" stroke="#994433" stroke-width="2"/>
<text x="528" y="384" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">显</text>
<text x="452" y="206" font-size="13" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">如在</text>
<text x="40" y="432" font-size="15" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">体物而不可遗　诚之不可揜</text>
</svg>
