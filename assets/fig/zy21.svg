<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img">
<title>自诚明与自明诚图：两条入口一个环</title>
<desc>中央一个圆环，上写诚，下写明；左侧实线箭头由诚向明，标自诚明谓之性；右侧虚线箭头由明向诚，标自明诚谓之教。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>
<circle cx="360" cy="240" r="96" fill="none" stroke="#DCD5C8" stroke-width="2"/>
<text x="360" y="176" font-size="26" fill="#994433" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">诚</text>
<text x="360" y="330" font-size="26" fill="#25211D" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif">明</text>
<path d="M300 196 C252 240 252 258 300 300" fill="none" stroke="#994433" stroke-width="2.5"/>
<path d="M300 300 l-12 -4 l6 -10 Z" fill="#994433"/>
<path d="M420 300 C468 258 468 236 420 196" fill="none" stroke="#7C6D5C" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M420 196 l10 2 l-5 10 Z" fill="#7C6D5C"/>
<text x="182" y="228" font-size="14" fill="#994433" font-family="'Noto Serif SC','Songti SC',serif">自诚明</text>
<text x="182" y="250" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">谓之性 · 天道</text>
<text x="486" y="228" font-size="14" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">自明诚</text>
<text x="486" y="250" font-size="13" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">谓之教 · 人道</text>
<text x="60" y="430" font-size="14" fill="#25211D" font-family="'Noto Serif SC','Songti SC',serif">诚则明矣，明则诚矣</text>
<text x="470" y="430" font-size="12" fill="#7C6D5C" font-family="'Noto Serif SC','Songti SC',serif">实线为必然，虚线为可能</text>
</svg>
