<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第三章义理图：至与久——一横一竖的度</title>
<desc>上为横轴，标不及、中（至）、过三点，唯中加朱；下为纵轴，自下而上标一次、期月、三年、十年，末段虚线示「鲜能久」，另一条不断细线贯穿到底，题「能久」。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="46" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">横看是准　竖看是久</text>

<line x1="90" y1="120" x2="630" y2="120" stroke="#7C6D5C" stroke-width="1.2"/>
<polygon points="630,120 620,115 620,125" fill="#7C6D5C"/>
<polygon points="90,120 100,115 100,125" fill="#7C6D5C"/>

<circle cx="230" cy="120" r="4" fill="#7C6D5C"/>
<circle cx="360" cy="120" r="5" fill="#994433"/>
<circle cx="500" cy="120" r="4" fill="#7C6D5C"/>

<text x="230" y="102" font-size="13" text-anchor="middle" fill="#25211D">不及</text>
<text x="230" y="146" font-size="11" text-anchor="middle" fill="#7C6D5C">未至</text>

<text x="360" y="100" font-size="16" text-anchor="middle" fill="#994433">中＝至</text>
<text x="360" y="148" font-size="11" text-anchor="middle" fill="#7C6D5C">过则失中　不及则未至</text>

<text x="500" y="102" font-size="13" text-anchor="middle" fill="#25211D">过</text>
<text x="500" y="146" font-size="11" text-anchor="middle" fill="#7C6D5C">失中</text>
</g>

<rect x="60" y="180" width="600" height="270" fill="#FCFAF6" stroke="#DCD5C8"/>
<line x1="150" y1="420" x2="150" y2="205" stroke="#7C6D5C" stroke-width="1.2"/>
<polygon points="150,205 145,215 155,215" fill="#7C6D5C"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="118" y="420" font-size="12" text-anchor="end" fill="#25211D">一次</text>
<text x="118" y="368" font-size="12" text-anchor="end" fill="#25211D">期月</text>
<text x="118" y="310" font-size="12" text-anchor="end" fill="#25211D">三年</text>
<text x="118" y="252" font-size="12" text-anchor="end" fill="#25211D">十年</text>

<line x1="140" y1="420" x2="160" y2="420" stroke="#7C6D5C"/>
<line x1="140" y1="368" x2="160" y2="368" stroke="#7C6D5C"/>
<line x1="140" y1="310" x2="160" y2="310" stroke="#7C6D5C"/>
<line x1="140" y1="252" x2="160" y2="252" stroke="#7C6D5C"/>

<path d="M150 420 C 300 400, 420 340, 470 300" stroke="#DCD5C8" stroke-width="1" fill="none"/>
<path d="M150 420 C 300 395, 430 320, 500 270" stroke="#994433" stroke-width="2" fill="none"/>
<path d="M500 270 L 552 236" stroke="#DCD5C8" stroke-width="1.4" stroke-dasharray="6 6"/>

<text x="566" y="238" font-size="11" fill="#7C6D5C">鲜能久</text>
<text x="430" y="342" font-size="13" fill="#994433">能久</text>
</g>
</svg>
