<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第八章义理图：一善入胸</title>
<desc>左手托一枚写着一善的方片，弧线送入胸口轮廓，胸内留朱点；右侧同一处境再现，朱点仍在。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="44" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">得一处，捧住，下次还在</text>

<path d="M60 240 q 20 -26 46 -20 q 26 6 40 24 q 16 22 -6 38 l -80 0 z" fill="#FCFAF6" stroke="#7C6D5C"/>
<rect x="96" y="196" width="34" height="28" fill="#FCFAF6" stroke="#994433"/>
<text x="113" y="215" font-size="11" text-anchor="middle" fill="#994433">一善</text>
<text x="120" y="286" font-size="11" text-anchor="middle" fill="#7C6D5C">拳拳：捧，不是抓</text>

<path d="M140 210 C 210 160, 250 200, 268 218" stroke="#DCD5C8" stroke-width="1.2" fill="none" stroke-dasharray="5 4"/>

<path d="M300 150 q 40 -30 80 0 l 24 60 q 20 60 -52 72 q -72 -12 -52 -72 z" fill="#FCFAF6" stroke="#25211D" stroke-width="1.2"/>
<circle cx="360" cy="228" r="5" fill="#994433"/>
<text x="392" y="232" font-size="11" fill="#994433">服膺</text>
<text x="336" y="300" font-size="11" text-anchor="middle" fill="#7C6D5C">膺：胸</text>

<line x1="430" y1="228" x2="530" y2="228" stroke="#DCD5C8" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="480" y="212" font-size="11" text-anchor="middle" fill="#7C6D5C">下次同处境</text>

<circle cx="600" cy="228" r="26" fill="none" stroke="#DCD5C8"/>
<circle cx="600" cy="228" r="5" fill="#994433"/>
<text x="600" y="300" font-size="11" text-anchor="middle" fill="#7C6D5C">弗失：行为里没滑掉</text>

<text x="360" y="380" font-size="12" text-anchor="middle" fill="#25211D">择 → 得 → 捧 → 守：四步都不需要天分，只需要肯做</text>
<text x="360" y="408" font-size="11" text-anchor="middle" fill="#7C6D5C">舜向外求度的来源，颜回向内守度的存续</text>
</g>
</svg>
