<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480">
<title>第二章义理图：时中与无忌惮</title>
<desc>中间一条横线为度，线上有可移动朱点，标时中；线外左右各有越界脚印，标无忌惮。</desc>
<rect x="0" y="0" width="720" height="480" fill="#F7F4EE"/>

<g font-family="'Noto Serif SC','Songti SC',serif">
<text x="360" y="44" font-size="13" text-anchor="middle" fill="#7C6D5C" letter-spacing="3">一条线，两种人</text>

<line x1="80" y1="210" x2="640" y2="210" stroke="#25211D" stroke-width="1.6"/>
<polygon points="640,210 630,205 630,215" fill="#25211D"/>
<polygon points="80,210 90,205 90,215" fill="#25211D"/>

<text x="360" y="196" font-size="13" text-anchor="middle" fill="#7C6D5C">度　·　此刻该站的那一点</text>

<circle cx="250" cy="210" r="7" fill="#994433"/>
<circle cx="250" cy="210" r="13" fill="none" stroke="#994433" stroke-width="1" stroke-dasharray="4 4"/>
<text x="250" y="252" font-size="14" text-anchor="middle" fill="#994433">时中</text>
<text x="250" y="272" font-size="11" text-anchor="middle" fill="#7C6D5C">每刻重新定位</text>

<path d="M470 210 l 14 -30 l 14 30 l 14 -30 l 14 30" stroke="#7C6D5C" stroke-width="1.4" fill="none"/>
<text x="500" y="252" font-size="14" text-anchor="middle" fill="#7C6D5C">无忌惮</text>
<text x="500" y="272" font-size="11" text-anchor="middle" fill="#7C6D5C">不是不知线，是不怕越</text>

<rect x="60" y="312" width="600" height="120" fill="#FCFAF6" stroke="#DCD5C8"/>
<text x="80" y="342" font-size="12" fill="#7C6D5C">君子而时中</text>
<text x="80" y="368" font-size="12" fill="#25211D">知其在我：中不在天上，在这一念</text>
<text x="80" y="394" font-size="12" fill="#25211D">戒谨恐惧：不是怕人，是怕越线</text>
<text x="80" y="420" font-size="11" fill="#7C6D5C">中庸是常：偶尔一次不算，做成日常才算</text>
</g>
</svg>
